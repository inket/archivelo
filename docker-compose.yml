services:
  web:
    image: ghcr.io/inket/archivelo:latest
    container_name: archivelo
    ports:
      - "8000:8000"
    volumes:
      # Small, worth backing up: the SQLite database and log file.
      - ./config:/config
      # Large, and often wanted on a different/bigger drive -- point this
      # at any host path you like, e.g. an absolute path on another volume:
      #   - /volume2/archivelo-downloads:/downloads
      - ./downloads:/downloads
    environment:
      - DATABASE_PATH=/config/app.db
      - LOG_PATH=/config/app.log
      - DOWNLOAD_DIR=/downloads
      - POLL_INTERVAL_SECONDS=900
      - MAX_CONCURRENT_DOWNLOADS=1
      - SOURCE_BASE_URL=https://tiz-cycling.tv
      # If you're putting this behind a reverse proxy at a subpath (e.g.
      # "https://example.org/archivelo"), set BASE_PATH to that path
      # ("/archivelo"). The app owns that prefix internally, so a plain
      # forward is enough -- no rewrite/strip rule needed, e.g. nginx:
      #   location /archivelo/ { proxy_pass http://archivelo:8000; }
      # Leave empty to serve at the domain root (default).
      - BASE_PATH=
      # Set these to your NAS user's uid/gid (e.g. `id <username>` over
      # SSH, or check the user's properties in your NAS's admin UI) so
      # downloaded files land owned by you instead of root. Leave both
      # at 0 to run as root.
      - PUID=0
      - PGID=0
    restart: unless-stopped
    # Docker's own capture of the container's stdout/stderr has no size
    # limit by default and isn't the same thing as the app's own log file
    # above (/config/app.log, which already rotates itself) -- cap it so a
    # long-running container doesn't slowly fill the host's disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
