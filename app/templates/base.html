<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e7e7ea;
      --text: #18181b;
      --text-muted: #71717a;
      --text-faint: #a1a1aa;
      --accent: #143a40;
      --accent-hover: #1c4a52;
      --accent-soft: #e8f1f2;
      --coral: #f0516f;
      --coral-soft: #fde3e8;
      --amber: #f2aa1b;
      --amber-soft: #fdedcf;
      --cyan: #2ec8d9;
      --cyan-soft: #d9f4f7;
      --blue: #3b82f6;
      --blue-soft: #dbeafe;
      --radius: 10px;
      --radius-sm: 7px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header.site-header {
      background: var(--bg); position: relative;
    }
    header.site-header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      /* Season order: Giro d'Italia (pink, May), Tour de France (yellow, July), Vuelta a España (red, Aug-Sep) */
      background: linear-gradient(90deg, #ff4fa3, #ffd500, #e4002b);
    }
    .header-inner {
      max-width: 980px; margin: 0 auto; padding: 18px 24px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap;
    }
    .brand {
      font-weight: 400; font-size: 15px; color: var(--text);
      letter-spacing: 0.22em;
    }
    .brand:hover { text-decoration: none; }
    .main-nav { display: flex; gap: 4px; }
    .main-nav a {
      padding: 7px 14px; border-radius: 999px;
      color: var(--text-muted); font-size: 13.5px; font-weight: 600;
      transition: background .15s ease, color .15s ease;
    }
    .main-nav a:hover { background: #e9e9ea; color: var(--text); text-decoration: none; }
    .main-nav a[aria-current="page"] { background: var(--accent); color: #fff; }

    .main-nav a.nav-categories:hover { background: var(--coral-soft); color: #b91c3f; }
    .main-nav a.nav-categories[aria-current="page"] { background: var(--coral); color: #fff; }
    .main-nav a.nav-downloads:hover { background: var(--amber-soft); color: #8a5b0a; }
    .main-nav a.nav-downloads[aria-current="page"] { background: var(--amber); color: #fff; }
    .main-nav a.nav-archive:hover { background: var(--cyan-soft); color: #0e6d78; }
    .main-nav a.nav-archive[aria-current="page"] { background: var(--cyan); color: #fff; }

    main.container { max-width: 980px; margin: 0 auto; padding: 40px 24px 72px; }

    /* Theater mode (video page): wider player, sidebar/text out of the way,
       no need for actual browser fullscreen. */
    body.theater-mode main.container { max-width: 1600px; padding-top: 16px; }
    body.theater-mode .theater-hide { display: none; }

    h2 { font-size: 21px; font-weight: 650; margin: 0 0 8px; letter-spacing: -0.015em; }
    h3 { font-size: 15px; font-weight: 650; margin: 32px 0 14px; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 26px; max-width: 660px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-family: inherit; font-size: 13px; font-weight: 550;
      padding: 7px 16px; border-radius: 999px;
      border: 1px solid transparent; cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
      white-space: nowrap; line-height: 1.4;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); text-decoration: none; }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #f4f4f5; text-decoration: none; }
    .btn:disabled { opacity: .5; cursor: default; }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; margin-left: 4px; padding: 0;
      border: none; background: transparent; color: inherit;
      font-size: 18px; line-height: 1; border-radius: 5px; cursor: pointer;
      transition: background .15s ease, opacity .15s ease; vertical-align: -6px;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, .08); }
    .icon-btn:disabled { opacity: .4; cursor: default; }

    table.compact { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.compact th {
      text-align: left; font-size: 11px; font-weight: 650; text-transform: uppercase;
      letter-spacing: .04em; color: var(--text-faint);
      padding: 0 14px 10px; border-bottom: 1px solid var(--border);
    }
    table.compact td { padding: 13px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.compact tbody tr:last-child td { border-bottom: none; }
    table.compact tbody tr:hover { background: #fbfbfc; }
    table.compact td small { color: var(--text-muted); }
    table.compact td small a { color: var(--text-muted); }
    table.compact td small a:hover { color: var(--accent); }

    .thumb {
      width: 92px; aspect-ratio: 16 / 9; object-fit: cover;
      border-radius: var(--radius-sm); display: block; background: #f0f0f2;
    }

    .status-badge {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      font-size: 11.5px; font-weight: 550; letter-spacing: .01em;
    }
    .status-discovered { background: #f0f0f2; color: var(--text-muted); }
    .status-queued { background: var(--amber-soft); color: #8a5b0a; }
    .status-downloading { background: var(--cyan-soft); color: #0e6d78; }
    .status-downloaded { background: var(--blue-soft); color: #1d4ed8; }
    .status-failed { background: var(--coral-soft); color: #b91c3f; }
    .status-skipped { background: #f0f0f2; color: var(--text-muted); }
    .status-canceled { background: #f0f0f2; color: var(--text-muted); }

    .status-action {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 14px; border-radius: 999px;
      font-size: 11.5px; font-weight: 550; letter-spacing: .01em;
      font-family: inherit; cursor: pointer;
      background: var(--surface); border: 1px solid;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .status-action-default { color: var(--accent); border-color: rgba(20, 58, 64, .3); }
    .status-action-default:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status-action-failed { color: var(--coral); border-color: rgba(240, 81, 111, .35); }
    .status-action-failed:hover { background: var(--coral); color: #fff; border-color: var(--coral); }

    .progress-bar { background: #f0f0f2; border-radius: 4px; height: 6px; overflow: hidden; width: 100%; margin-top: 5px; }
    .progress-bar-fill { background: var(--accent); height: 100%; transition: width .3s ease; }

    .save-confirmation {
      font-size: 13px; font-weight: 550; color: var(--accent);
      display: inline-flex; align-items: center; gap: 4px;
      animation: fade-out 2.5s ease forwards;
    }
    @keyframes fade-out { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

    .worker-status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
      padding: 5px 12px 5px 10px; margin-bottom: 22px;
    }
    .worker-status .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .worker-status-ok .dot { background: var(--cyan); }
    .worker-status-warn .dot { background: var(--amber); }
    .worker-status-error .dot { background: var(--coral); }
    .worker-status-checking .dot { background: #64748b; animation: status-pulse 1.1s ease-in-out infinite; }
    .worker-status-neutral .dot { background: var(--text-faint); }
    @keyframes status-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .worker-status strong { color: var(--text); font-weight: 600; }

    input[type=search], input[type=text] {
      width: 100%; font-family: inherit; font-size: 14px;
      padding: 9px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
    }
    input[type=search]:focus, input[type=text]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    input[type=search]::placeholder { color: var(--text-faint); }

    input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

    form.search-form { margin-bottom: 20px; }

    .subscribe-form {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 8px;
    }
    .subscribe-form label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }

    .page-nav { display: flex; justify-content: space-between; margin-top: 24px; font-size: 13.5px; }

    .settings-grid {
      display: grid; grid-template-columns: 190px minmax(200px, 320px) 1fr;
      column-gap: 24px; row-gap: 18px; align-items: center; max-width: 820px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; margin-bottom: 20px;
    }
    .settings-grid .settings-label { font-size: 13px; font-weight: 550; }
    .settings-grid .settings-help { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
    .settings-grid input[type=text] { width: 100%; }
    @media (max-width: 700px) {
      .settings-grid { grid-template-columns: 1fr; }
      .settings-grid .settings-help { margin-top: -8px; }
    }

    .external-link { font-size: 13px; color: var(--text-muted); display: inline-block; margin-bottom: 20px; }
    .external-link:hover { color: var(--accent); }

    .back-link { font-size: 13px; margin-bottom: 14px; display: inline-block; }

    .empty-state { color: var(--text-muted); font-size: 13.5px; padding: 18px 0; }

    .log-viewer {
      background: #18181b; color: #e4e4e7; border-radius: var(--radius);
      padding: 16px 18px; font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12.5px; line-height: 1.6; overflow-x: auto;
      white-space: pre-wrap; word-break: break-word; max-height: 75vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ base_path }}/">ARCHIVELO</a>
      <nav class="main-nav">
        <a class="nav-latest" href="{{ base_path }}/" aria-current="{{ 'page' if active_tab == 'latest' else 'false' }}">Latest</a>
        <a class="nav-categories" href="{{ base_path }}/categories" aria-current="{{ 'page' if active_tab == 'categories' else 'false' }}">Races &amp; Categories</a>
        <a class="nav-downloads" href="{{ base_path }}/downloads" aria-current="{{ 'page' if active_tab == 'downloads' else 'false' }}">Downloads</a>
        <a class="nav-archive" href="{{ base_path }}/archive" aria-current="{{ 'page' if active_tab == 'archive' else 'false' }}">Archive</a>
        <a class="nav-settings" href="{{ base_path }}/settings" aria-current="{{ 'page' if active_tab == 'settings' else 'false' }}">Settings</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Dates are rendered server-side in UTC (the server has no idea what
    // timezone the visitor is in); this rewrites them to the browser's
    // local timezone/locale once the page (or an htmx-swapped fragment)
    // is in the DOM.
    function localizeDates(root) {
      (root || document).querySelectorAll(".local-datetime[data-utc]").forEach(function (el) {
        var d = new Date(el.getAttribute("data-utc"));
        if (isNaN(d.getTime())) return;
        el.textContent = d.toLocaleString(undefined, {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
      });
    }
    document.addEventListener("DOMContentLoaded", function () { localizeDates(); });
    document.body.addEventListener("htmx:afterSwap", function (e) { localizeDates(e.target); });
  </script>
</body>
</html>
