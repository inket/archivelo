{# The <video> player, its keyboard shortcuts, resume position and theater
   mode. Used for both a downloaded file and a stream straight from the
   source site -- expects `video` and `player_src`. #}
      <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <button type="button" id="theater-toggle" class="status-action status-action-default" title="Bigger player, less clutter -- no fullscreen needed">
          <svg width="13" height="13" viewBox="0 0 16 16" style="margin-right: 5px; vertical-align: -2px;"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span id="theater-toggle-label">Theater mode</span>
        </button>
      </div>
      <video id="video-player" controls preload="metadata" style="width: 100%; border-radius: var(--radius); background: #000; display: block;" src="{{ player_src }}"></video>
      <script>
        (function () {
          var player = document.getElementById("video-player");
          if (!player) return;
          var SKIP_SECONDS = 5;
          document.addEventListener("keydown", function (e) {
            var tag = (document.activeElement && document.activeElement.tagName) || "";
            if (tag === "INPUT" || tag === "TEXTAREA") return;
            if (e.key === "ArrowLeft") {
              player.currentTime = Math.max(0, player.currentTime - SKIP_SECONDS);
              e.preventDefault();
            } else if (e.key === "ArrowRight") {
              player.currentTime = Math.min(player.duration || Infinity, player.currentTime + SKIP_SECONDS);
              e.preventDefault();
            }
          });

          // Remember playback position, so reopening this page resumes
          // where you left off instead of starting over.
          var resumeAt = {{ video.watch_position_seconds }};
          player.addEventListener("loadedmetadata", function () {
            if (resumeAt > 1 && resumeAt < player.duration - 2) {
              player.currentTime = resumeAt;
            }
          });

          function savePosition(pos) {
            var body = new Blob(["position=" + encodeURIComponent(pos)], { type: "application/x-www-form-urlencoded" });
            navigator.sendBeacon("{{ base_path }}/videos/{{ video.id }}/position", body);
          }

          var lastSaveAt = 0;
          player.addEventListener("timeupdate", function () {
            var now = Date.now();
            if (now - lastSaveAt > 5000) {
              lastSaveAt = now;
              savePosition(player.currentTime);
            }
          });
          player.addEventListener("pause", function () { savePosition(player.currentTime); });
          player.addEventListener("ended", function () { savePosition(0); });
          window.addEventListener("beforeunload", function () { savePosition(player.currentTime); });

          // Theater mode: a wider player and less surrounding text, without
          // going into the browser's actual fullscreen. Remembered across
          // videos via localStorage -- it's a viewing preference, not
          // something tied to this specific video.
          var THEATER_KEY = "archivelo-theater-mode";
          var toggle = document.getElementById("theater-toggle");
          var toggleLabel = document.getElementById("theater-toggle-label");
          function setTheaterMode(on) {
            document.body.classList.toggle("theater-mode", on);
            if (toggleLabel) toggleLabel.textContent = on ? "Exit theater mode" : "Theater mode";
            try { localStorage.setItem(THEATER_KEY, on ? "1" : "0"); } catch (e) {}
          }
          if (toggle) {
            toggle.addEventListener("click", function () {
              setTheaterMode(!document.body.classList.contains("theater-mode"));
            });
            var stored = null;
            try { stored = localStorage.getItem(THEATER_KEY); } catch (e) {}
            if (stored === "1") setTheaterMode(true);
          }
        })();
      </script>
